<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raahi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Special+Elite&family=Tiro+Devanagari+Hindi:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Nastaliq+Urdu:wght@400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a one-way ticket diary on a slate desk; a two-page spread on wide screens, one page on phones */
  --slate: #2b2d42;
  --paper: #f2e6cc;
  --ink: #2b2d42;
  --stamp: #b23a3a;
  --brass: #e2c48a;
  --faded: rgba(43, 45, 66, 0.62);
  --display: "Rozha One", "Tiro Devanagari Hindi", Georgia, serif;
  --type: "Special Elite", "Courier New", monospace;
  --body: "EB Garamond", "Iowan Old Style", Georgia, serif;
  --deva: "Tiro Devanagari Hindi", "Noto Serif Devanagari", serif;
  --urdu: "Noto Nastaliq Urdu", serif;
  --fs: 17px;
  --grain: none;
  --routes: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--slate);
  background-image:
    radial-gradient(ellipse 60% 50% at 50% 34%, rgba(242, 230, 204, 0.08) 0%, rgba(242, 230, 204, 0) 70%),
    radial-gradient(ellipse 90% 80% at 50% 45%, #33364f 0%, #222337 80%);
  color: var(--paper);
  font-family: var(--body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 12px 12px 10px;
}
#stage { position: relative; }
#stage::after {
  content: "";
  position: absolute;
  left: 6%; right: 6%; bottom: -18px; height: 30px;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 70%);
  z-index: -1;
  pointer-events: none;
}
#loading { font: 400 1rem var(--type); color: rgba(242, 230, 204, 0.6); letter-spacing: 0.08em; }

/* ---------- pages ---------- */
.bookfont { font-size: var(--fs); }
.page {
  background-color: var(--paper);
  background-image: var(--grain);
  color: var(--ink);
  overflow: hidden;
  font-family: var(--body);
}
.page.left  { background-image: linear-gradient(to left, rgba(70, 50, 25, 0.2), rgba(70, 50, 25, 0) 10%), var(--grain); }
.page.right { background-image: linear-gradient(to right, rgba(70, 50, 25, 0.2), rgba(70, 50, 25, 0) 10%), var(--grain); }
.page-inner {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 7.5% 10% 5.5% 10%;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1em;
  min-height: 1.8em;
  padding-bottom: 0.4em;
  margin-bottom: 1em;
  border-bottom: 1.5px dashed rgba(43, 45, 66, 0.3);
  font: 400 0.72em/1.3 var(--type);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--faded);
}
.page-head .dv { font: 400 1.3em/1 var(--deva); letter-spacing: 0; text-transform: none; color: var(--stamp); }
.page-head .ht { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none; }
.page-head .ht:lang(hi) { font: 400 1.2em/1 var(--deva); letter-spacing: 0; }
.page-head .ht:lang(ur) { font: 400 1.1em/1 var(--urdu); letter-spacing: 0; }
.page-body {
  --lh: 1.75em;
  flex: 1;
  min-height: 0;
  overflow: hidden;
  line-height: var(--lh);
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--lh) - 1px), rgba(43, 45, 66, 0.09) calc(var(--lh) - 1px), rgba(43, 45, 66, 0.09) var(--lh));
  background-position: 0 0.05em;
}
.page-body.hi { --lh: 1.95em; font-family: var(--deva); font-size: 0.97em; }
.page-body.rtl { --lh: 2.5em; direction: rtl; font-family: var(--urdu); font-size: 0.92em; }
.page-foot {
  padding-top: 0.6em;
  display: flex;
  justify-content: center;
  gap: 0.6em;
  align-items: baseline;
  font: 400 0.74em/1 var(--type);
  color: var(--faded);
  min-height: 1.4em;
}
.page-foot .dv { font-family: var(--deva); font-size: 1.15em; }

/* entry header */
.entry-head { margin-bottom: var(--lh); direction: ltr; }
.rtl .entry-head { direction: rtl; }
.entry-meta { display: flex; align-items: center; gap: 0.9em; flex-wrap: wrap; font-family: var(--type); }
.stamp-date {
  display: inline-block;
  padding: 0.38em 0.6em 0.3em;
  border: 2px solid var(--stamp);
  border-radius: 3px;
  color: var(--stamp);
  font: 400 0.72em/1 var(--type);
  letter-spacing: 0.14em;
  transform: rotate(-2.5deg);
  opacity: 0.9;
}
.entry-kind { font: 400 0.72em/1 var(--type); letter-spacing: 0.16em; text-transform: uppercase; color: var(--faded); }
.entry-title {
  margin: 0.45em 0 0.1em;
  font: 400 1.85em/1.25 var(--display);
  color: var(--ink);
  text-wrap: balance;
}
.hi .entry-title { font-size: 1.9em; }
.rtl .entry-title { font: 400 1.7em/1.9 var(--urdu); }
.route-rule { display: block; width: 9em; height: 0.85em; margin-top: 0.4em; color: var(--stamp); opacity: 0.8; }
.rtl .route-rule { margin-left: auto; transform: scaleX(-1); }

/* poems */
.stanza { margin: 0 0 var(--lh); }
.line { padding-left: 1.6em; text-indent: -1.6em; }
.rtl .line { padding-left: 0; padding-right: 1.6em; }
/* stories */
.prose p { margin: 0; text-align: justify; hyphens: auto; text-indent: 1.6em; }
.prose p.first, .prose p.cont { text-indent: 0; }
.prose p.split { text-align-last: justify; }
.prose p.dropcap::first-letter {
  float: left;
  font: 400 3.4em/0.85 var(--display);
  padding: 0.06em 0.1em 0 0;
  color: var(--stamp);
}
.rtl.prose p { text-indent: 0; }
/* thoughts */
.thought p { margin: 0 0 var(--lh); font: italic 400 1.12em/var(--lh) var(--body); }
.hi.thought p { font: 400 1.05em/var(--lh) var(--deva); }
.rtl.thought p { font: 400 1em/var(--lh) var(--urdu); }
.thought .qmark { display: block; height: var(--lh); font: 400 3em/1 var(--display); color: var(--stamp); opacity: 0.55; }
.end-orn { display: block; margin: 0.3em auto 0; width: 1.3em; height: 1.3em; color: var(--stamp); opacity: 0.7; }

/* contents: a timetable of stops */
.toc-head { text-align: center; margin-bottom: 0.8em; }
.toc-head .dv { display: block; font: 400 2.4em/1.4 var(--display); color: var(--stamp); }
.toc-head .en { display: block; font: 400 0.7em/1.4 var(--type); letter-spacing: 0.26em; text-transform: uppercase; color: var(--faded); }
.toc-cols { display: flex; gap: 0.6em; padding-bottom: 0.3em; border-bottom: 1.5px dashed rgba(43,45,66,0.3); font: 400 0.62em/1.4 var(--type); letter-spacing: 0.14em; color: var(--faded); }
.toc-cols .c1 { flex: 0 0 3.4em; } .toc-cols .c2 { flex: 1; } .toc-cols .c3 { flex: 0 0 auto; }
.toc-list { display: flex; flex-direction: column; }
.toc-row {
  display: flex;
  align-items: baseline;
  gap: 0.55em;
  width: 100%;
  min-height: var(--lh);
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  color: var(--ink);
  font: 400 1em/var(--lh) var(--body);
  text-align: left;
  border-radius: 2px;
}
.toc-row > * { pointer-events: none; }
.toc-row:hover .toc-title { color: var(--stamp); }
.toc-row:focus-visible { outline: 2px solid var(--stamp); outline-offset: 2px; }
.toc-stop { flex: 0 0 2em; font: 400 0.8em/1 var(--type); color: var(--faded); }
.toc-kind { flex: 0 0 3em; font: 400 0.92em/1 var(--deva); color: var(--stamp); }
.toc-title { font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
.toc-title[lang="hi"] { font-family: var(--deva); font-style: normal; font-size: 0.95em; }
.toc-title[lang="ur"] { font-family: var(--urdu); font-style: normal; font-size: 0.85em; }
.toc-roman { font: italic 400 0.92em var(--body); color: var(--faded); }
.toc-dots { flex: 1; border-bottom: 1px dotted rgba(43,45,66,0.4); transform: translateY(-0.3em); min-width: 1em; }
.toc-num { font: 400 0.9em/1 var(--type); min-width: 1.6em; text-align: right; }
.toc-empty { font-style: italic; color: var(--faded); text-align: center; margin-top: 2em; }

/* title page and the road ahead */
.center-page { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10%; gap: 0.3em; }
.tt-hi { font: 400 4.6em/1.2 var(--display); color: var(--stamp); }
.tt-en { font: 400 1em/1.4 var(--type); letter-spacing: 0.45em; padding-left: 0.45em; }
.tt-tag { margin-top: 1.2em; font: italic 400 1.35em/1.3 var(--body); }
.tt-tagh { font: 400 1.05em/1.6 var(--deva); color: var(--faded); }
.tt-fields { margin-top: 2em; width: 100%; max-width: 18em; padding-top: 1em; border-top: 1.5px dashed rgba(43,45,66,0.35); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9em 1em; text-align: left; font-family: var(--type); }
.field { display: flex; flex-direction: column; gap: 0.2em; }
.field .k { font-size: 0.62em; letter-spacing: 0.12em; color: var(--faded); }
.field .v { font-size: 0.95em; }
.unwritten .dv { font: 400 1.7em/1.6 var(--display); color: rgba(43,45,66,0.3); }
.unwritten .en { font: 400 0.8em/1.4 var(--type); letter-spacing: 0.16em; text-transform: uppercase; color: rgba(43,45,66,0.38); }

/* the ticket: front and back covers */
.cover { position: relative; font-family: var(--type); color: var(--ink); }
.notches { position: absolute; top: 3%; bottom: 3%; display: flex; flex-direction: column; justify-content: space-between; z-index: 1; }
.notches.l { left: -0.45em; } .notches.r { right: -0.45em; }
.notches span { display: block; width: 0.9em; height: 0.9em; border-radius: 50%; background: var(--slate); }
.cv { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 8% 11% 9%; }
.cv-top { display: flex; justify-content: space-between; gap: 1em; padding-bottom: 1em; border-bottom: 2px dashed rgba(43,45,66,0.45); font-size: 0.74em; letter-spacing: 0.12em; }
.cv-top .dv, .field .dv { font-family: var(--deva); letter-spacing: 0; }
.cv-hi { margin-top: 0.35em; font: 400 5.4em/1.2 var(--display); color: var(--stamp); }
.cv-en { font-size: 1.1em; letter-spacing: 0.45em; }
.cv-fields { margin-top: 1.6em; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.1em 1.2em; }
.cv-fields .wide { grid-column: span 2; }
.cv-stampbox { margin-top: auto; display: flex; justify-content: flex-end; }
.cv-stamp {
  width: 8.6em; height: 8.6em; border-radius: 50%;
  border: 3px solid var(--stamp); color: var(--stamp);
  box-shadow: inset 0 0 0 0.35em var(--paper), inset 0 0 0 0.47em var(--stamp);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15em;
  transform: rotate(-14deg); opacity: 0.86; text-align: center;
}
.cv-stamp .a { font-size: 0.95em; letter-spacing: 0.1em; }
.cv-stamp .b { font: 400 0.8em/1.3 var(--display); }
.back .cv { align-items: center; justify-content: center; gap: 1.1em; text-align: center; }
.barcode { width: 11em; height: 3.6em; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 9px, var(--ink) 9px 12px, transparent 12px 14px); opacity: 0.85; }
.back .k1 { font: 400 1.15em/1.6 var(--deva); }
.back .k2 { font-size: 0.78em; letter-spacing: 0.1em; color: var(--faded); max-width: 18em; }

/* endpapers: a route map */
.page.endpaper, .page.endpaper.left, .page.endpaper.right { background-color: var(--slate); background-image: var(--routes); }
.endpaper .plate {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-2deg);
  width: 64%; padding: 1.3em 1.1em;
  background: var(--paper); background-image: var(--grain);
  border-radius: 4px;
  box-shadow: 0 0.8em 1.6em rgba(0,0,0,0.35);
  text-align: center; color: var(--ink);
  font-family: var(--type);
}
.plate .dv { display: block; font: 400 1.45em/1.5 var(--display); color: var(--stamp); }
.plate .en { display: block; margin-top: 0.4em; padding-top: 0.6em; border-top: 1.5px dashed rgba(43,45,66,0.4); font-size: 0.8em; letter-spacing: 0.12em; }

/* ---------- controls ---------- */
#controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 6px 10px;
  font: 400 0.86rem/1 var(--type);
  color: rgba(242, 230, 204, 0.8);
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5em;
  min-height: 36px;
  padding: 0 0.95em;
  border: 1px solid rgba(242, 230, 204, 0.25);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.03);
  color: inherit;
  font: inherit;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.btn:hover { background: rgba(242, 230, 204, 0.09); border-color: rgba(242, 230, 204, 0.5); color: var(--paper); }
.btn:focus-visible, #vol:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.btn svg { width: 1.05em; height: 1.05em; }
.btn.icon { padding: 0; width: 36px; justify-content: center; }
.btn[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); background: rgba(226, 196, 138, 0.1); }
#pageinfo { min-width: 8em; text-align: center; color: rgba(242, 230, 204, 0.55); }
.music { display: inline-flex; align-items: center; gap: 8px; }
#vol { width: 78px; accent-color: var(--brass); }
#vol[hidden] { display: none; }
.sep { width: 1px; height: 20px; background: rgba(242, 230, 204, 0.2); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* measuring room, never seen */
#measure { position: fixed; left: -10000px; top: 0; visibility: hidden; pointer-events: none; }
#measure .page { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

/* fallback when the page-turn script is unavailable */
#stage.nolib { overflow-y: auto; height: calc(100vh - 90px); display: flex; flex-direction: column; gap: 16px; }
#stage.nolib .page { position: relative; flex: 0 0 auto; }

@media (max-width: 520px) {
  #controls { font-size: 0.8rem; gap: 6px; }
  .label-long, .sep { display: none; }
  #vol { width: 60px; }
}
@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage" aria-live="polite"><p id="loading">Boarding…</p></div>
  <nav id="controls" aria-label="Diary controls" hidden>
    <button class="btn icon" id="prev" type="button" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="btn" id="toc" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Contents
    </button>
    <span id="pageinfo">Cover</span>
    <button class="btn" id="latest" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18l-5-4-5 4z"/></svg>
      <span>Latest<span class="label-long"> entry</span></span>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <span class="music">
      <button class="btn" id="music" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
        <span id="musiclabel">Play piano</span>
      </button>
      <label class="visually-hidden" for="vol">Piano volume</label>
      <input id="vol" type="range" min="0" max="100" value="45" hidden>
    </span>
    <button class="btn icon" id="next" type="button" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
</div>
<div id="measure" class="bookfont" aria-hidden="true"></div>

<script src="lib/page-flip.js"></script>
<script>
(function () {
  "use strict";

  /* ---------------- small helpers ---------------- */
  const KINDS = {
    poem:    { en: "Poem",    hi: "कविता" },
    thought: { en: "Thought", hi: "ख़याल" },
    story:   { en: "Story",   hi: "कहानी" }
  };
  const DV_DIGITS = "०१२३४५६७८९";
  const toDeva = n => String(n).replace(/\d/g, d => DV_DIGITS[d]);
  const pad2 = n => String(n).padStart(2, "0");
  const reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "html") el.innerHTML = v;
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) {
      if (kid == null) continue;
      el.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    }
    return el;
  }
  function stampDate(iso) {
    const d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return iso || "";
    try {
      return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }).toUpperCase();
    } catch (e) { return iso; }
  }
  function longDate(iso) {
    const d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return iso || "";
    try { return d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
    catch (e) { return iso; }
  }

  /* ---------------- ornaments: routes and stations ---------------- */
  const routeRule = () =>
    `<svg class="route-rule" viewBox="0 0 140 12" aria-hidden="true"><line x1="7" y1="6" x2="133" y2="6" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"/><circle cx="7" cy="6" r="3.4" fill="currentColor"/><circle cx="70" cy="6" r="2.6" fill="#f2e6cc" stroke="currentColor" stroke-width="1.3"/><circle cx="133" cy="6" r="3.6" fill="#f2e6cc" stroke="currentColor" stroke-width="1.5"/></svg>`;
  const endOrn = () =>
    `<svg class="end-orn" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>`;

  function makeTextures() {
    try {
      const c = document.createElement("canvas");
      c.width = c.height = 220;
      const g = c.getContext("2d");
      const img = g.createImageData(220, 220);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 110 + Math.random() * 90;
        img.data[i] = v; img.data[i + 1] = v * 0.93; img.data[i + 2] = v * 0.8;
        img.data[i + 3] = Math.random() * 20;
      }
      g.putImageData(img, 0, 0);
      g.strokeStyle = "rgba(110, 85, 50, 0.05)";
      for (let i = 0; i < 40; i++) {
        g.beginPath();
        const x = Math.random() * 220, y = Math.random() * 220;
        g.moveTo(x, y);
        g.quadraticCurveTo(x + Math.random() * 30 - 15, y + Math.random() * 30 - 15, x + Math.random() * 40 - 20, y + Math.random() * 40 - 20);
        g.stroke();
      }
      document.documentElement.style.setProperty("--grain", `url(${c.toDataURL()})`);
    } catch (e) { /* plain paper is fine */ }

  class Piano {

      const rev = ctx.createConvolver(); rev.buffer = this.impulse(4.5);

      for (let ch = 0; ch < 2; ch++) {

      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      src.connect(bp); bp.connect(g); g.connect(this.fx);
      src.start(t);
    }

    try {
      const e = entryAt(i);
      const want = e != null ? "#" + book.posts[e].id : "";
      if ((location.hash || "") !== want) history.replaceState(null, "", want || (location.pathname + location.search));
    } catch (err) { /* hash is a convenience only */ }
  }
  function describe(i) {
    const n = book.pages.length;
    if (i === 0) return "Cover";
    if (i >= n - 1) return "Back cover";
    if (!geo.spread) return `Page ${i} of ${n - 2}`;
    const left = i % 2 === 1 ? i : i - 1;
    return `Pages ${left}–${left + 1}`;
  }
  function onPage(i) {
    current = i;
    info.textContent = describe(i);
    setHash(i);
  }
  function go(i) {
    if (!flip) return;
    i = Math.max(0, Math.min(book.pages.length - 1, i));
    if (reduced) flip.turnToPage(i), onPage(i); else flip.flip(i);
  }

  function render(startAt) {
    geo = geometry();
    book = buildBook(data, geo);
    if (flip) { try { flip.destroy(); } catch (e) {} flip = null; }
    stage.innerHTML = "";
    stage.classList.remove("nolib");
    stage.style.width = (geo.spread ? geo.w * 2 : geo.w) + "px";
    stage.style.height = geo.h + "px";
    const block = h("div", { class: "bookfont", id: "book" });
    stage.appendChild(block);
    book.pages.forEach(p => block.appendChild(p));
    document.getElementById("measure").innerHTML = "";
    const start = Math.max(0, Math.min(book.pages.length - 1, startAt || 0));
    if (!window.St || !St.PageFlip) {
      stage.classList.add("nolib");
      stage.style.height = "";
      onPage(start);
      return;
    }
    flip = new St.PageFlip(block, {
      width: geo.w,
      height: geo.h,
      size: "fixed",
      showCover: true,
      usePortrait: true,
      autoSize: true,
      drawShadow: true,
      maxShadowOpacity: 0.35,
      flippingTime: reduced ? 250 : 950,
      mobileScrollSupport: false,
      startPage: start,
      showPageCorners: true
    });
    flip.loadFromHTML(book.pages);
    flip.on("flip", e => onPage(e.data));
    flip.on("changeState", e => { if (e.data === "flipping") piano.rustle(); });
    onPage(flip.getCurrentPageIndex ? flip.getCurrentPageIndex() : start);
    block.addEventListener("click", e => {
      const row = e.target.closest && e.target.closest(".toc-row");
      if (row && row.dataset.page) go(parseInt(row.dataset.page, 10));
    });
  }

  function wire() {
    document.getElementById("prev").addEventListener("click", () => flip && flip.flipPrev());
    document.getElementById("next").addEventListener("click", () => flip && flip.flipNext());
    document.getElementById("toc").addEventListener("click", () => go(3));
    document.getElementById("latest").addEventListener("click", () => {
      if (book.starts.length) go(book.starts[book.starts.length - 1]);
    });
    document.addEventListener("keydown", e => {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      if (e.key === "ArrowRight") { flip && flip.flipNext(); e.preventDefault(); }
      if (e.key === "ArrowLeft") { flip && flip.flipPrev(); e.preventDefault(); }
    });
    const mbtn = document.getElementById("music"), mlabel = document.getElementById("musiclabel"), vol = document.getElementById("vol");
    mbtn.addEventListener("click", async () => {
      try {
        if (piano.on) { piano.stop(); mbtn.setAttribute("aria-pressed", "false"); mlabel.textContent = "Play piano"; vol.hidden = true; }
        else { await piano.start(); mbtn.setAttribute("aria-pressed", "true"); mlabel.textContent = "Piano on"; vol.hidden = false; }
      } catch (e) {
        mlabel.textContent = "Sound unavailable";
        mbtn.disabled = true;
      }
    });
    vol.addEventListener("input", () => piano.setVolume(vol.value / 100));
    document.addEventListener("visibilitychange", () => {
      if (!piano.ctx) return;
      if (document.hidden && piano.on) piano.ctx.suspend().catch(() => {});
      else if (!document.hidden && piano.on) piano.ctx.resume().catch(() => {});
    });
    window.addEventListener("hashchange", () => { const i = indexForHash(); if (i != null && i !== current) go(i); });
    let t = null;
    window.addEventListener("resize", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        const g = geometry();
        if (Math.abs(g.w - geo.w) > 6 || Math.abs(g.h - geo.h) > 6 || g.spread !== geo.spread) render(current);
      }, 280);
    });
  }

  async function main() {
    makeTextures();
    try {
      const r = await fetch("posts.json", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
    } catch (e) {
      document.getElementById("loading").textContent = "The diary’s pages could not be loaded. Reload the page to try again.";
      return;
    }
    if (data.diary && data.diary.title_en) document.title = data.diary.title_en;
    try {
      await Promise.race([
        Promise.all(["400 1em 'Rozha One'", "400 1em 'Special Elite'", "400 1em 'Tiro Devanagari Hindi'", "400 1em 'EB Garamond'", "italic 400 1em 'EB Garamond'"]
          .map(f => document.fonts.load(f, "राही Aa"))),
        new Promise(res => setTimeout(res, 3500))
      ]);
    } catch (e) { /* fall back to system fonts */ }
    render(0);
    controls.hidden = false;
    wire();
    const i = indexForHash();
    if (i != null) setTimeout(() => go(i), 400);
  }
  main();
})();
</script>
</body>
</html>
